server:
  port: 8080

spring:
  application:
    name: dailyspend-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/dailyspend}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:mysuperlongsecretkeymysuperlongsecretkey123}
  expiration: ${JWT_EXPIRATION:864000000}

app:
  upi:
    max-collection-amount: 25000.00
